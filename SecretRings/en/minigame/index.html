var currentMenu = null;
var currentSubmenu = null;
var timeoutDelay = 650;
var hideSubmenuTimeout = null;
var hideMenuTimeout = null;
var mnuSelected = '';
var subMnuSelected = '';


function mouseOverMenuItem(menuRef, submenuId) {
//	alert (submenuId);
	clearTimeout(hideMenuTimeout);
	document.getElementById(menuRef.id).style.backgroundColor='#C4CCD7';
 	if (submenuId == "00"){
		hideSubmenuTimeout = setTimeout("hideCurrentSubmenu();", timeoutDelay-300);
	} else if (submenuId != null) {
		showSubmenu(submenuId);
   } 
}

function mouseOutMenuItem(menuRef) {
	document.getElementById(menuRef.id).style.backgroundColor='#7B8DA5';
    delayHideMenu();
}

function delayHideMenu() {
	hideMenuTimeout = setTimeout("hideCurrentMenu();", timeoutDelay);
}

function showMenu(menu) {
   clearTimeout(hideMenuTimeout);
   var menuRef = document.getElementById(menu);
   if (menuRef != currentMenu) {
      hideCurrentMenu();
      menuRef.style.visibility = 'visible';
      currentMenu = menuRef;
   }
}

function hideCurrentMenu() {
   if (currentMenu != null) {
      if (currentSubmenu != null) {
         hideCurrentSubmenu();
      }
      document.getElementById(currentMenu.id).style.visibility = 'hidden';
      currentMenu = null;
   }
}

function showSubmenu(menu) {
   clearTimeout(hideMenuTimeout);
   clearTimeout(hideSubmenuTimeout);
   var menuRef = document.getElementById(menu);
   if (menuRef != currentSubmenu) {
		hideCurrentSubmenu();
		document.getElementById(menuRef.id).style.visibility = 'visible';
      currentSubmenu = menuRef;
   }
}

function hideCurrentSubmenu() {
   if (currentSubmenu != null) {
		document.getElementById(currentSubmenu.id).style.visibility = 'hidden';
		currentSubmenu = null;
   }
}

function delayHideSubmenu() {
   hideSubmenuTimeout = setTimeout("hideCurrentSubmenu();", timeoutDelay);
}

function hideMenusNow() {
   hideCurrentSubmenu(); hideCurrentMenu();
}

}
