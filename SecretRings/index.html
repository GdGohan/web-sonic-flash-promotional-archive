	<script>

        var sw = 1080;
        var sh = 800;

        function resize() {
		    const player = document.querySelector("#rings");
            
			const vp = document.getElementById("flashcontent");
			
			if (!player) {
			    vp.style.width = "100%";
				vp.style.height = "100%";
				return;
			}

			const scale = Math.min(
				window.innerWidth / sw,
				window.innerHeight / sh
			);
			
			vp.style.top = "50%";
			vp.style.left = "50%";

			vp.style.transform =
				`translate(-50%, -50%) scale(${scale})`;
		}
       
		var so = new SWFObject("swf/top.swf", "rings", sw, sh, "8", "#000000");

        so.addParam("allowFullScreen", "true");
        so.addParam("allowScriptAccess", "always");
      
        so.addParam("wmode", "window");
        so.addParam("quality", "best");
        so.addParam("menu", "false");
		
		so.addParam("base", "./swf/");
        
        so.write("flashcontent");
		
		window.addEventListener("resize", resize);
        resize();
    </script>
