    <style>
		html, body {
		    margin: 0;
		    width: 100%;
		    height: 100%;
		    overflow: hidden;
		    background: #ffffff;
		}
		
		#flashcontent {
		    left: 25%;
		    position: absolute;
		    transform-origin: center center;
		    overflow: hidden;
		}
		
	</style>

    <script>
		window.RufflePlayer = window.RufflePlayer || {};
		window.RufflePlayer.config = {
		    logLevel: "info",
		    fontSources: [
				"../fonts/NotoSansJP-Regular.ttf"
			],
			defaultFonts: {
				sans: ["Noto Sans JP Regular"],
			},
			autoplay: "off",
			unmuteOverlay: "visible",
			// preferredRenderer: "canvas"
		};
		console.log("Ruffle config:", window.RufflePlayer.config);
	</script>
	
	<script>

        var sw = window.innerWidth;
        var sh = 695;

        function resize() {
		    const player = document.querySelector("#sonicflash");
            
			const vp = document.getElementById("flashcontent");
			
			if (!player) {
			    vp.style.width = "100%";
				vp.style.height = "100%";
				return;
			}

			const scale = Math.min(
				window.innerWidth / sw,
				window.innerHeight / sh
			);
			
			vp.style.top = "50%";
			vp.style.left = "50%";

			vp.style.transform =
				`translate(-50%, -50%) scale(${scale})`;
		}
		
		const ruffle = window.RufflePlayer.newest();
		const player = ruffle.createPlayer();

		player.id = "sonicflash";
		player.setAttribute("name", "sonicflash");
		
		player.style.width = sw + "px";
		player.style.height = sh + "px";

		document.getElementById("flashcontent").innerHTML = "";
		document.getElementById("flashcontent").appendChild(player);
		
		const base = new URL("./swf/", window.location.href).href;
		const url = new URL("./swf/top.swf", window.location.href).href;

		console.log("URL:", url);
		console.log("BASE:", base);

		player.load({
			url: url,
			base: base,

			width: sw,
			height: sh,
			bgcolor: "#ffffff",

			allowFullscreen: true,
			allowScriptAccess: "always",

			wmode: "window",
			quality: "best",
			menu: false
		});
		
		window.addEventListener("resize", resize);
        resize();
    </script>
